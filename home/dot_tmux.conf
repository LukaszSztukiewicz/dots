# Legacy ~/.tmux.conf path.
# The real config lives at $XDG_CONFIG_HOME/tmux/tmux.conf (~/.config/tmux/tmux.conf).
# tmux 3.1+ reads the XDG path directly; older versions and many tools only
# look at ~/.tmux.conf, so we keep this thin wrapper as the single source.
source-file ~/.config/tmux/tmux.conf
