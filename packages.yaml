packages:
  - name: zsh
    ubuntu: zsh
  # tmux: install via scripts/install-tmux.sh on chezmoi apply (upstream installer),
  # not apt; minimal images often ship tmux too old for OSC52 passthrough.
  - name: git
    ubuntu: git
  - name: curl
    ubuntu: curl
  # ncurses-term: provides the tmux-256color terminfo entry. Without it,
  # p10k inside tmux falls back to limited colors on minimal images.
  - name: ncurses-term
    ubuntu: ncurses-term
  - name: vim
    ubuntu: vim
  # neovim: install via scripts/install-nvim.sh (apt nvim is too old for LazyVim).
  # Auto-runs via home/run_onchange_install-nvim.sh.tmpl on every role.
  - name: ripgrep
    ubuntu: ripgrep
  # fzf: install via scripts/install-fzf.sh (upstream installer; apt's
  # packaging on minimal images is missing examples/key-bindings.zsh).
  - name: fd-find
    ubuntu: fd-find
  - name: jq
    ubuntu: jq
  # btop: NOT auto-installed on apply anymore — run scripts/install-btop.sh
  # manually if you want it.
